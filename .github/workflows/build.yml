name: Build

on: pull_request

jobs:
  build:
    runs-on: [ubuntu-latest]
    if: ${{ !contains(github.event.head_commit.message, 'skip ci') }}
    steps:
      - name: Checkout Sources
        uses: actions/checkout@v4
        with:
          path: udm-iptv
      - name: Setup Dependencies
        run: sudo apt-get install devscripts debhelper build-essential shellcheck
      - name: Run shell checks
        run: |
          cd udm-iptv
          shellcheck --severity=error udhcpc.hook udm-iptvd udm-iptv profiles/*.profile debian/config debian/postinst
          sh tests/run.sh
      - name: Build Package
        run: |
          cd udm-iptv
          debuild -uc -us --lintian-opts --profile debian
      - name: Verify package safety
        run: |
          package=$(find . -maxdepth 1 -name 'udm-iptv_*_all.deb' -print -quit)
          test -n "$package"
          dpkg-deb --ctrl-tarfile "$package" | tar -xOf - ./postinst > /tmp/udm-iptv.postinst
          if grep -Eq 'deb-systemd-invoke.*(start|restart)' /tmp/udm-iptv.postinst; then
            echo "Package must not auto-start udm-iptv" >&2
            exit 1
          fi
          dpkg-deb --contents "$package" | grep -q 'profiles/shanghai-telecom.profile'
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          if-no-files-found: error
          path: |
            *.deb
            *.build*
            *.changes
            *.dsc
