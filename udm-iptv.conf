## Example configuration for udmp-iptv ##
# Interface on which IPTV traffic enters the router
IPTV_WAN_INTERFACE="eth8"
# ID of VLAN which carries IPTV traffic (use 0 if no VLAN is used)
IPTV_WAN_VLAN="4"
# Name of the IPTV VLAN interface
IPTV_WAN_VLAN_INTERFACE="iptv"
# IP ranges from which the IPTV traffic originates (separated by spaces)
IPTV_WAN_RANGES="213.75.0.0/16 217.166.0.0/16"
# DHCP options to send when requesting an IP address
IPTV_WAN_DHCP_OPTIONS="-O staticroutes -V IPTV_RG"
# LAN interfaces on which IPTV should be made available
IPTV_LAN_INTERFACES="br0"
# Disable quickleave for igmpproxy
IPTV_IGMPPROXY_DISABLE_QUICKLEAVE="false"
# Enable debugging for igmpproxy
IPTV_IGMPPROXY_DEBUG="false"

# Routing table used for IPTV DHCP and static routes. Use a dedicated numeric
# table to prevent IPTV routes from changing the gateway's main WAN routing.
IPTV_ROUTE_TABLE="main"
# Priority for one policy rule per IPTV LAN interface when using a dedicated table
IPTV_ROUTE_RULE_PRIORITY="18500"
# Installing a DHCP default route in the main table is unsafe by default
IPTV_ALLOW_MAIN_DEFAULT_ROUTE="false"

# Enable source NAT towards IPTV. When WAN ranges contain 0.0.0.0/0, set this
# to the IPTV client subnet(s), for example 192.168.85.0/24.
IPTV_NAT_ENABLE="true"
IPTV_NAT_SOURCE_RANGES=""
# Explicit compatibility escape hatch; do not enable on multi-WAN gateways
IPTV_ALLOW_UNSCOPED_NAT="false"
